aid: humeo-inc
name: Humeo, INC.
description: Humeo, INC. is a San Francisco-based applied AI research lab focused on creative
  intelligence, blending design, social science, and frontier AI research. Its products include
  VideoClaw, a desktop creative production agent that transforms existing media and automates media
  creation, and Studio, a web application for producing high-impact short-form video content. Humeo's
  research spans creative attunement, taste modeling, universal media transformation, world models of
  attention, and creative efficiency. The company is backed by 500 Global. As of this profile Humeo
  publishes no public API, developer portal, or documentation; VideoClaw is in private alpha with
  access granted by request.
